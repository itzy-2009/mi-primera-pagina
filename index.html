<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola soy Karen y Jessi </title>
  <style>
    :root {
      --bg-principal: #fff5f7;  /* Fondo rosa muy suave */
      --texto-rosa: #f472b6;     /* Rosa pastel vibrante */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-principal);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      color: var(--texto-rosa);
      font-size: 3rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Hola, soy Karen y Jessi</h1>

</body>
</html>
